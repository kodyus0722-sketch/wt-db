function sidx(c){
  if(c._s)return c._s;
  const base=c.name.replace(/（.*?）/g,""),rd=READ[base],f=[c.name,base,c.team,c.pos,PN[c.pos]||""];
  if(rd){rd.rs.forEach(a=>f.push(a));rd.rg.forEach(a=>f.push(a));rd.rs.forEach(a=>rd.rg.forEach(b=>f.push(a+b)))}
  return c._s=f.map(norm).join("|");
}

function affOne(c,k){
  if(!k)return true;
  if(k==="border")return !isNei(c);
  if(k==="tama")return TAMA.includes(c.team);
  if(k==="nei")return isNei(c);
  if(k==="aft")return c.team==="アフトクラトル";
  if(k==="gal")return c.team==="ガロプラ";
  return true;
}
function affOK(c,set){return set.size===0||Array.from(set).some(k=>affOne(c,k))}
function togSet(set,v){if(v==="")set.clear();else if(set.has(v))set.delete(v);else set.add(v)}
function sval(c,key){
  if(key==="total")return c.total;

  if(c.pos==="OP")return i===0?c.st[0]:null;

}

  tg.onclick=()=>{PANEL=!PANEL;render()};
  render();

    const k=norm(q);
    const nAct=(SORT.key!==""?1:0)+FILT.aff.size+FILT.pos.size+(FILT.noBlack?1:0);

function filtered(kind,val){
  let rows=[],title="",note="";
  if(kind==="p"){title=`ポジション：${val}${PN[val]?"（"+PN[val]+"）":""}`;rows=DATA.filter(c=>c.pos===val).map(c=>rowHTML(c))}
  else if(kind==="t"){title=`所属隊：${val}`;rows=DATA.filter(c=>c.team===val).map(c=>rowHTML(c,PN[c.pos]||""))}
  else{
    const exact=kind==="g";
    title=`トリガー：${val}${exact?"":"（派生を含む）"}`;
    const hit=n=>n&&n!=="■"&&(exact?n===val:base(n)===val);
    DATA.forEach(c=>{const s=tsets(c);if(!s)return;const m=s.M.some(hit),u=!!s.S&&s.S.some(hit);if(m||u)rows.push(rowHTML(c,(m?"メイン":"")+(m&&u?"・":"")+(u?"サブ":"")))});
    if(exact&&/[：〈]/.test(val))note=`<p><button class="lk" data-h="#b/${enc(base(val))}">「${base(val)}」の派生トリガーも含めて見る</button></p>`;
    note+=`<p class="sub" style="font-size:12px">枠の位置が未確認の隊員は、参照元の記載をもとにしています。</p>`;
  }
  app.innerHTML=`${topbar()}<button class="back" data-a="back">‹ 戻る</button><h1>${title}</h1><div class="cnt">${rows.length}人</div>${note}<div>${rows.join("")||'<p class="sub">該当する隊員がいません。</p>'}</div>`;
  scrollTo(0,0);
}

function radar(st,keys,total,isOp,hid){
  const cx=180,cy=140,R=90,M=10,n=keys.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/M,cy+Math.sin(a)*R*v/M]};
  const poly=v=>Array.from({length:n},(_,i)=>pt(i,v).join(",")).join(" ");
  const H=i=>hid.has(String(i));
  let s=`<svg viewBox="0 0 360 280" role="img" aria-label="ステータスレーダーチャート"><defs><clipPath id="oct"><polygon points="${poly(M)}"/></clipPath></defs>`;
  [2,4,6,8,10].forEach(v=>s+=`<polygon points="${poly(v)}" fill="none" stroke="var(--line)"/>`);
  for(let i=0;i<n;i++){const[x,y]=pt(i,M);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}
  s+=`<g clip-path="url(#oct)"><polygon points="${st.map((v,i)=>pt(i,H(i)?0:(v||0)).join(",")).join(" ")}" fill="var(--fill)" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>`;
  st.forEach((v,i)=>{if(v==null||H(i))return;const[x,y]=pt(i,v);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--ac)"/>`});
  s+=`</g>`;
  keys.forEach((k,i)=>{const[x,y]=pt(i,M+1.9);const an=Math.abs(x-cx)<5?"middle":x>cx?"start":"end";
    const val=H(i)?"？":(st[i]??"—"),wrap=k==="防御・援護";
    s+=`<text x="${x}" y="${y+4}" text-anchor="${an}" font-size="12" fill="var(--fg)">${k}${wrap?"":" "}<tspan${wrap?` x="${x}" dy="15"`:""} font-weight="700" fill="var(--ac)">${val}</tspan></text>`});
  s+=`<text x="8" y="272" font-size="13" fill="var(--sub)">合計${isOp?"（トリオン除く）":""} <tspan font-weight="700" font-size="16" fill="var(--fg)">${hid.size?"？":(total??"—")}</tspan></text>`;
  return s+"</svg>";
}

function trig(c){

  const ts=tsets(c);
  if(!ts)return `${head}<p class="sub">参照元にデータがありません。</p>`;
  const{M,S,ver}=ts;
  const note=ver?"出典：公式データブック BORDER BRIEFING FILE（枠の位置まで確認済み）":"枠の位置は未確認です。参照元の記載順に左から詰めて表示しています（FREE? は空きがあることだけ確認）。";
  const n=Math.max(M.length,S?S.length:0),fr=ver?"FREE":"FREE?";
  const hid=T.m==="hidden"?T.act:new Set(),sel=T.m==="select"?T.sel:null;
  let g="";
  for(let i=0;i<n;i++)g+=(S?cell("サブ",i,S[i],fr,"s"+i,hid,sel):"<div></div>")+cell("メイン",i,M[i],fr,"m"+i,hid,sel);

}

","二宮は加賀美の作った3つの塔を見てどう思った？","「自分が困惑しているのだから、相手も困惑する。問題ない」と思っていた。","KC","s",[11]],["2026-01-05","d","来馬は加古・二宮を何と呼ぶ？","「加古ちゃん」「二宮くん」。","CG","s",[11]],["2026-01-05","d","鳩原は実況・解説をしたことがある？","解説は普通にしたことがありそう。当真や二宮隊のメンバーとセットで呼ばれたかも。","KC","s",[11]],["2026-01-11","d","鳩原が密航する未来を、迅は予知できなかった？","迅があまり本部に行っていない時期の出来事で、関知していなかった説と、知っていてあえて見逃した説がある。8：2で前者だと思う。","EC","s",[11]],["2019-06-13","d","辻の兄弟の名前は？","兄が遼太郎、弟が奏平。","G","s",[0]],["2019-06-12","d","影浦はなぜマスクを？","ギザギザの歯を隠すためと、SE対策の気休めとして肌の露出面積を減らすため。","EC","s",[0]],["2026-01-05","d","影浦は実家の店を手伝う？","ボーダー入隊後に手伝うようになり、母は喜んでいる。","CG","s",[11]],["2026-01-10","d","出水と米屋の個人ランク戦の勝率は？","出水6.5：米屋3.5くらい。対戦を持ちかけるのは10割米屋。","K","s",[11]],["2014-08-01","d","スナイパーにとって視力は重要？","戦闘体になると視力は回復するので、生身の視力は関係ない。メガネキャラが戦闘体でもメガネなのは、アイデンティティを守るため。","TR","s",[0]],["2026-01-07","d","生駒隊は最初から4人だった？","県外組（イコ・マリオ・水上・隠岐）は同期入隊で、もともとチームを組む気があった。B級に上がって隊を組む時に、海がスカウトされた。","K","s",[11]],["2026-01-08","d","イコが居合を始めたのは？","中1（13歳）。ふざけがちなイコに一本芯を通すため、厳格な祖父が立ち上がった結果が今のイコ。","C","s",[11]],["2026-01-10","d","イコは花に詳しい？「野に咲く花」の元ネタに気づいた人は？","花の知識はマリオから流入したものでは。元ネタに疑いの目を向けているのは、王子・水上・小佐野・加賀美あたり。","CZ","s",[11]],["2026-01-05","d","王子が橘高羽矢を「羽矢さん」と呼ぶ理由は？","旧弓場隊で、ののを「ののさん」と呼んでいた流れだと思う。","C","s",[11]],["2026-01-10","d","橘高羽矢の妹は？","桜（3つ下）とかごめ（5つ下）。呼び名は「おねえちゃん」か、先生呼びのあだ名。","G","s",[11]],["2026-01-08","d","東隊のメンバーの選考基準は？","隊長就任の要請に、東が根負けするかどうか。大事なのはやる気。","K","s",[11]],["2014-01-31","d","諏訪と堤は？（C級の訓練室で見かけた二人）","タバコの金髪が諏訪洸太郎（21歳）、細目が堤大地（20歳）。B級10位・諏訪隊の隊員。","OC","s",[0]],["2015-01-26","d","諏訪はトリオン体なのになぜ煙草を吸う？","かっこつけるため。灰皿の描写がなく、煙草ではない可能性もある。","CF","s",[0]],["2014-01-31","d","奈良坂はたけのこ派なのに、きのこ派のふりをしているのはなぜ？","無用の流血を避けるため。","CZ","s",[0]],["2026-01-11","d","諏訪と堤はランク戦でもスタアメーカーを？","相手のカメレオンを牽制する対策トリガーとして、持っているだけで意味がある装備なのでは。","TK","s",[11]],["2026-01-11","d","半崎の「ダルい」口癖は、荒船たちは直そうとしなかった？","ポカリの倒置法も矯正された気配がないので、個性として許されているのでは。","C","s",[11]],["2026-01-08","d","漆間隊の二人の学校は？","二人とも普通校組。漆間は1年A組、六田は2年C組。","KG","s",[11]],["2015-08-29","d","別役はなぜスカウトされた？","若さ、そこそこのトリオン量、高いテンションと輝く瞳が決め手。","O","s",[0]],["2026-01-11","d","来馬隊は「鈴鳴第一」だが、「第二」はある？","今はないが、鈴鳴所属のC級隊員がいるので、今後増える可能性がある。","K","s",[11]],["2014-09-19","d","新3バカのフォーメーションは？","「酉の陣」のほか「辰の陣」「巳の陣」「午の陣」など計10種。9つは全員で一斉攻撃、残り1つが全力逃走。","KC","s",[0]],["2026-01-08","d","ガロプラ遠征メンバーにきょうだいは？","ガトリンには弟、ウェンには父親違いの妹と弟がいる。天涯孤独のコスケロにも、いたのかもしれない。","NG","s",[11]],["2026-01-08","d","ヒュースはカナダをどれくらい知っている？","「海産物がうまい、あと雪山」くらいの雰囲気でカナダ人をやっている。もっとがんばれ。","MN","s",[11]],["2026-01-07","d","「卵の冠」の弾は合成して、雑種や空想の生き物を作れる？","ハイレインが、大規模侵攻での出水の合成弾をモニターしていたなら、今ごろできるようになっている可能性はある。","TN","s",[11]],["2022-07-04","d","雷神丸は陽太郎が生まれた時からいた？","雷神丸が生まれたのは、瑠花たちが玄界に亡命してからなので、陽太郎よりやや遅れる。","MZ","s",[1]],["2013-11-01","d","隊員は給料をもらえる？","正隊員はもらえる。B級はトリオン兵討伐の出来高払い、A級は給料＋出来高払い、C級は訓練生なので無給。","O","s",[0]],["2013-12-03","d","隊員がみんな若いのは？","いちばんの理由は、若いほどトリオン器官が成長しやすいから。20歳を過ぎて成長が止まった隊員は、防衛隊から本部運営に回ることが多い（沢村など）。","RO","s",[0]],["2013-12-03","d","入隊の条件は？","基礎体力テスト・基礎学力テスト・面接はあるが、トリオン量と犯罪歴以外で落とされることはまずない（修は落とされかけた）。年齢制限もなく、若い方が有利なだけ。（2013/12、2014/4）","O","s",[0]],["2026-01-06","d","学力が低くても入れる？","米屋・太一・ヒカリが無限の可能性を示している。","OG","s",[11]],["2013-12-03","d","高校生隊員はみんな同じ学校？","防衛隊員のスケジュール管理上、なるべく同じ学校に入るが、別の高校も可能。","OG","s",[0]],["2014-01-28","d","オペレーターにはどうやってなる？","最初から希望する場合と、戦闘員から転職する場合がある。基本は「本部情報局のオペレーター（中央オペレーター）」から始まり、紹介や募集で別の部署・部隊に配属される。宇井や羽矢も元は中央オペレーター。（2014/1、2026/1）","O","s",[0]],["2026-01-06","d","オペレーターのスカウト基準は？","人柄・処理能力・やる気・学力・将来性。","O","s",[11]],["2014-01-28","d","オペレーターは女の子しかなれない？","ほぼ全員が女性（並列処理能力が高いと言われるため）だが、男性もなれる。逆にエンジニアはほぼ全員が男性。","O","s",[0]],["2014-01-28","d","チームの人数上限は？","戦闘員4人＋オペレーター1人の5人まで。それ以上は、オペレーターの情報処理能力を超えると言われる。","OK","s",[0]],["2014-04-05","d","B級・A級になったら隊を組まないといけない？","ランク戦に出るには、最低でも戦闘員1人＋オペレーター1人のコンビが必要。少人数チームは茨の道。","OK","s",[0]],["2014-04-05","d","師匠なしでA級に上がった人は？","何人かいる（出水・菊地原・米屋など）。師匠がいなくても、ライバルがいれば強くなれる。","OK","s",[0]],["2014-04-06","d","新人はどうやって師匠を探す？","最初は上手い人の試合や映像で勉強し、形になってきたら直接声をかけるか仲介を頼む。ひたすら個人ランク戦を挑む手もある。","OK","s",[0]],["2014-06-05","d","隊服のデザインはどう決まる？","基本デザインが数種類あり、各隊がアレンジする。市民に威圧感を与えないジャージ型が一般的。風間隊のように、機能を組み込んだ独自の改造スーツもある。","OK","s",[0]],["2014-06-24","d","遠征にオペレーターも同行する？","同行する。トリオンで動く携帯コンピューターがあり、電源のない遠征先でも支援できる。","O","s",[0]],["2014-06-26","d","現在のチーム数は？","A級が8チーム、B級が20チーム（ランク戦で変動）。","OK","s",[0]],["2014-08-19","d","遠征は相手国に気づかれないように行く？","基本は潜入で、交渉や交換でトリガー技術を手に入れる。戦争・紛争中の国では、襲ってきた相手を返り討ちにしてトリガーを手に入れることもある。","ON","s",[0]],["2014-09-02","d","B級隊にエンブレムはない？","一度でもA級になった隊には専用エンブレムがあり、B級に落ちても使える。解散すると消える。","OK","s",[0]],["2015-01-23","d","隊員はみんな三門市出身？","基本は三門市出身。他県でのスカウトも行われていて、少数だが他の地方の出身者もいる。","OG","s",[0]],["2015-08-28","d","玉狛・鈴鳴以外の支部は？","玉狛・鈴鳴・綿鮎・弓手町・早沼・久摩の6つ。基本的に仕事や学業を優先し、A級を目指さない（週2回のランク戦に出られない）隊員が所属する。警戒区域の外縁上に置かれ、玉狛以外は地域住民の窓口も担う。","O","s",[0]],["2026-01-07","d","遠方からのスカウト組はどこに住む？","本部住み・支部住み・市内で一人暮らしの3択。一人暮らしは家賃がかかるが補助が出る。","OG","s",[11]],["2026-01-07","d","18歳組で一人暮らしを始めそうな人は？","犬飼・蔵内・荒船・加賀美あたり。当真はすでに一人暮らし？（曖昧）","OG","s",[11]],["2015-08-29","d","休日の隊員は何をしている？","個人ランク戦、記録を見ての勉強、趣味、落ち込み、爆睡、給料の使い道を考える、課題に追われる、遊ぶ、小躍りする、墓参り、好きな人のことを考える、など。","KF","s",[0]],["2015-09-01","d","オールラウンダーの定義は？","ガンナー用とアタッカー用の両方で、それぞれ個人ポイント6000点以上を獲得した隊員。全体のレベルが上がり、8000点以上にすべきという声もある。","TK","s",[0]],["2014-07-21","d","オールラウンダーはスナイパーもできる？","基本はできない。狙撃もできる「パーフェクトオールラウンダー」はレイジだけ。","TK","s",[0]],["2019-06-10","d","トラッパーは何をする人？","ひたすら罠を仕掛ける。専用トリガー「スイッチボックス」は扱いが難しくトリオン消費も大きいため、基本的に他の攻撃トリガーは装備しない。","TK","s",[0]],["2013-12-14","d","レッドバレット（鉛弾）は専用？汎用？","ガンナー用トリガーと同時に使える汎用の射撃オプション。ハウンドと組み合わせた追尾鉛弾も可能だが、弾速と射程は大きく落ちる。","T","s",[0]],["2014-07-30","d","鉛弾1発の重さは？","約100kg。遊真の「錨」印は、その倍くらいの威力。","TZ","s",[0]],["2014-03-02","d","テレポートは連続で使える？","移動距離（＝消費トリオン）に応じた待ち時間が必要。長距離（30m以上）は数秒、短距離（2〜3m）は約0.5秒。","T","s",[0]],["2014-06-24","d","太刀川がイルガーを斬った時はテレポート？","グラスホッパーという、空中でジャンプできる機動戦用のオプションを使ったと思われる。","TC","s",[0]],["2014-06-28","d","諏訪のショットガンの性能は？","大きめの通常弾をまとめて放つ面攻撃型。散らばる角度はある程度調節できる。長所は瞬間火力、短所は射撃の合間に隙ができること。","T","s",[0]],["2014-06-29","d","スコーピオンはどこまで形を変えられる？","かなり自由。伸ばす長さは使用者のトリオン能力次第だが、伸ばすほど強度が落ち、全身に纏うとガラス並みの脆さになる。千佳なら全身に纏って戦えるかも。","T","s",[0]],["2014-06-30","d","弧月は出しっぱなし？","一度選択したら、ずっと出しっぱなし。消えている場面は描き忘れ。","T","s",[0]],["2015-01-30","d","弧月を消す／鞘に入れるの扱いは？","弧月をOFFにはできるが、切れ味ゼロの邪魔な状態になる。破棄して作り直せば邪魔にならないが、再度トリオンを消費する。銃型トリガーも同じ。スコーピオンは「しまう」だけで身軽になる。（2015/1、2015/8）","T","s",[0]],["2014-07-13","d","風間隊の隊服の丸い部分は？","カメレオンの消費トリオンを減らす機構。その分、戦闘体自体のコストは高い。","DT","s",[0]],["2014-07-18","d","スナイパーライフルは出しっぱなし？","銃タイプは一度出したら出しっぱなし。消すと、次に出す時にまたトリオンを消費する。","T","s",[0]],["2014-07-25","d","トリガー起動時の服装は？","「指定した服装の戦闘体に換装」と「今の服装のまま換装」を選べる。服装は複数登録できる。","TR","s",[0]],["2014-09-17","d","変身の掛け声は必須？","ホルダーに触れて明確に起動の意志を発すれば、無言でも別の言葉でもよい。","T","s",[0]],["2014-08-30","d","合成弾（トマホーク）は修にも作れる？","可能だが時間がかかる。今の修で約1分、出水は約2秒。","TK","s",[0]],["2014-09-11","d","シールドを遠隔で出せる距離は？","個人差はあるが約25mまで。この遠隔防御ができる点が、レイガスト（シールドモード）より優れている。","T","s",[0]],["2015-02-03","d","シールド／レイガスト／エスクードの違いは？","シールド：変形可、面積で耐久が変わる、離れた所に出せる、動かすと耐久が落ちる。レイガスト：変形可、手持ちで動かしても耐久は変わらない。エスクード：変形も移動もできず耐久が高く、生やす場所が必要。","T","s",[0]],["2015-08-31","d","レイガストのシールドモードはトリガー枠を使う？","オプションではなく標準機能なので、枠は使わない。","T","s",[0]],["2014-09-24","d","レイジのワイヤー（トラップ）は木虎と同じ？","同じ「スパイダー」。他のトリガーと連動させて使える。トラップの箱はメテオラ（27分割）。","TK","s",[0]],["2019-06-12","d","千佳がスパイダーを使ったら？","修の百倍以上のワイヤーを一度に張れるが、密度が高すぎて自分が動けなくなったり、自分や味方にワイヤーが刺さったりしそう。","TE","s",[0]],["2015-01-25","d","レーダーはオプショントリガー？","レーダーは、戦闘体やベイルアウトと一緒に入っている基本装備。ワイヤー（スパイダー）はオプショントリガー。","T","s",[0]],["2015-01-25","d","レーダーを頼りに狙撃できる？","方角は出るが高度が出ないので、人間サイズを狙い撃つのは難しい。","T","s",[0]],["2015-01-26","d","カメレオン中の相手はハウンドで追尾できる？レーダーには映る？","探知誘導のハウンドなら追尾できるが、壁などに遮られがち。レーダーには映るので、大雑把な迎撃は可能。","T","s",[0]],["2015-01-25","d","シューターのキューブ状のトリオンの呼び名は？","トリオンキューブ、ナタデココ、角砂糖、諏訪、とうふなど、みんな自由に呼んでいる。","TZ","s",[0]],["2015-02-03","d","エスクードで鉛弾を防げる？","トリオンが物質化しているので、壁や建物と同じ扱いで防げる。","T","s",[0]],["2015-02-03","d","千佳がC級訓練でバッグワームを持っているのは？","レイジが用意した玉狛のトリガー（ライフル3種＋バッグワーム）で、狙撃の基礎を教えるためのもの。","T","s",[0]],["2015-08-29","d","狙撃手用トリガーはどのくらいの距離で当てられる？","動かない的なら、奈良坂や半崎がイーグレットで1km先も当てられそう。アイビスやライトニングは射程がもっと短い。","T","s",[0]],["2013-12-14","d","トリオンで治療できる？","戦闘体の修復という意味では不可能。戦闘体は基本的に使い捨てで、壊れたらトリオンと時間をかけて作り直す。","R","s",[0]],["2013-12-14","d","トリオン体は痛みを感じる？","どこを損傷したか分かる程度の痛覚はある。設定で痛覚を完全にOFFにもできる。","R","s",[0]],["2013-12-14","d","トリオン器官は鍛えられる？回復する？","心肺機能や筋肉と同じで、鍛えればある程度向上し、栄養と休息で回復する。使わないと緩やかに衰え、使い続ければある程度維持できる。（2013/12、2015/1）","R","s",[0]],["2015-02-01","d","仮想戦闘モードでトリオン器官は鍛えられる？","鍛えられない。鍛えられるのは反射神経と戦闘経験のみ。トリオン器官は、実際にトリオンを消費して鍛える。","RO","s",[0]],["2014-06-24","d","トリオン体の間、生身はどこにある？","トリガーホルダー内の、トリオン体が入っていたスペースに入れ替わりで格納される。実際には、近界側の次元に確保された独立スペースにある。（2014/6、2015/9）","R","s",[0]],["2014-08-03","d","遊真が車に撥ねられた傷が元に戻ったのは？","トリオン体が修復された。遊真の普段の体は、戦闘用のトリオン体より耐久が低い代わりに、修復機能がある。","RM","s",[0]],["2014-09-21","d","自分で変身を解除した場合、トリオン体は作り直し？","「しまった」扱いなので、次に変身してもそのトリオン体を使える。ただしダメージは回復していない。","R","s",[0]],["2015-08-30","d","トリオン体の人も休息は必要？","必要。脳・神経が疲労を感じるうえ、トリオン体使用中はトリオン器官が回復しないため。","R","s",[0]],["2015-08-31","d","トリオン体の作り直し時間に個人差は？","トリオン量が多い人ほど戦闘体の構築コストが大きく、時間がかかる。千佳は時間がかかり、修は1〜2時間ほどで復帰できる。","R","s",[0]],["2019-06-13","d","トリオン器官を、殺さずに取り出せる？","今のところ技術的に不可能と思われる。黒トリガーなら、無傷で摘出もあり得るかも。","DR","s",[0]],["2026-01-06","d","トリオン兵に人が入って着ぐるみのように使える？","ラービットの胸郭内に隠れることはできそうだが、揺れて酔いそう。パワードスーツ的な運用も可能そうだが、無人機の方が使い勝手は良さそう。","TN","s",[11]],["2014-08-22","d","門が開くのは三門市だけ？","世界各地でこっそり開いて、人がさらわれている。三門市に巨大なものが開いたため、世界的には三門市のみの現象と認識されている。","NZ","s",[0]],["2022-07-04","d","旧東隊（二宮・加古・三輪が所属していた頃）のオペレーターは？","月見。","OK","s",[1]],["2022-07-04","d","二宮と出水（師匠）がランク戦をしたら、どちらが勝つ？","1対1なら二宮が約6割勝つ。チーム戦では太刀川隊がかなり勝ち越していて、出水が二宮を倒す場面も多かった。","KC","s",[1]],["2022-07-04","d","志岐がオペレーターになった理由は？","跳んだり走ったりが苦手だからだと思われる（男性が理由ではない）。","OC","s",[1]],["2022-07-04","d","荒船は、雷神丸を犬だと紹介されたらどうする？","明らかにげっ歯類に見えるので納得しないだろうが、「噛む」と言われたら身構える。","MZ","s",[1]],["2022-07-04","d","雷神丸は陽太郎が生まれた時からいた？","雷神丸が生まれたのは、瑠花たちが玄界へ亡命した後。陽太郎の誕生よりやや遅い。（コミックス23巻のネタバレを含む）","MZ","s",[1]],["2022-07-05","d","黒トリガーを起動するとトリオン量が増えるのはなぜ？","作った人のトリオン能力が上乗せされるため。作成時に全トリオンを注いで結晶化させるので、生前より出力が上がることが多い。","DT","s",[1]],["2022-07-05","d","那須の隊外の仲の良い友人は？","男子は従兄の奈良坂、その弟子の古寺、ゾエ、歌川。女子は照屋、小南、小早川、真木など（一部の名前は要確認）。","CG","s",[1]],["2022-07-05","d","茜の兄の名前と、引っ越し前にくまに想いを伝えた？","兄は祥真（表記は要確認）。告白はしていないと思われる（していたら那須隊の別れの場面が気まずくなるため）。","CG","s",[1]],["2022-07-05","d","鳩原が誰を撃って寝込んだ？","カメレオンで隠れていた歌川を誤射した。その後はレーダーに注意しながら狙撃する練習をしたらしい。","TC","s",[1]],["2022-07-05","d","射手のキューブの形がそれぞれ違うのはなぜ？","威力や弾数を細かく調整するため。立方体以外に分割するのは高度な技術で、出水もできるが形にはこだわっていないらしい。","T","s",[1]],["2022-07-06","d","辻の一番好きな恐竜は？","アロサウルス。海棲爬虫類や、サルコスクスのような大型ワニも好き。","CF","s",[1]],["2022-07-06","d","テレポーターは間に障害物があっても使える？","移動先への視線が通っていないと発動できず、障害物・目隠し・煙幕があると使えないと思われる。","T","s",[1]],["2022-07-06","d","ヒュースの角を引っ張ったり押したりすると痛い？","付け根や頭はあまり痛くないが、ぐいぐい動かすと首が痛むと思われる。","NC","s",[1]],["2022-07-06","d","ガンナー・シューター・万能手のランキングは？","うろ覚えとして、射手は二宮・出水・加古、銃手は里見・弓場・片桐、万能手はレイジ・嵐山・三輪の順だったと思う。","K","s",[1]],["2022-07-06","d","穏やかな外岡がパンクな髪型なのはなぜ？","「地味で見つけにくい」と言われたことをきっかけに、実力で派手にした結果が評判となり定着した（経緯の細部は要確認）。","CZ","s",[1]],["2022-07-07","d","ガロプラの緊急脱出トリガーはゼロから開発された？","アフトクラトルの情報をもとに開発したが、ゲート転送の技術自体は元からあった。ボーダーのものと同様にトリオンを大量に消費するので、レギーには不評だった。","DN","s",[1]],["2022-07-07","d","三輪・二宮・加古の好きな焼肉の部位は？","三輪はハラミとカルビ中心で何でも食べる。二宮は肩ロースとイチボ、加古はタンとランプが好き。","CF","s",[1]],["2022-07-07","d","水上と今は仲が良さそうだったが、同学年以外に交流はある？","親しいかは不明。ともに成績優秀なので、学校側にまとめて扱われたのかもしれない。","CG","s",[1]],["2022-07-07","d","国近が小南・木虎・香取を呼び捨てにするのは、後輩だから？","同学年以下で自分より賢そうな相手は、防衛本能からか大体呼び捨て。勉強を教わった今にだけは、さん付けや様付けで呼ぶ。","CG","s",[1]],["2022-07-07","d","迅のSEはどう発現し、オンオフできる？","脳内に新しいウィンドウが開く感覚。オフにはできないが、意識して見ないことはできる。一度見た相手は一定期間、未来の分岐を追跡できる。","E","s",[1]],["2023-08-14","d","修に玉狛以外で仲の良い隊員は？","菊地原、唯我、木虎あたりは友人と言える。","CG","s",[2]],["2023-08-14","d","遊真の身長はどこまで伸びる？","父・有吾が長身だったので175cm前後の可能性。","MG","s",[2]],["2023-08-14","d","進学校組は全員内部進学？","外部出身が2〜3割。辻は公立中学から受験した。","G","s",[2]],["2023-08-14","d","旧東隊解散後、三輪隊はどう結成された？","月見が三輪についてきて米屋と合流し、奈良坂を他隊と争って獲得。古寺はA級昇格直後に加入。","OK","s",[2]],["2023-08-14","d","古寺と茜、奈良坂の弟子になったのはどちらが先？","入隊は同時期。正隊員になったのは古寺が先。","KC","s",[2]],["2023-08-15","d","小南が幼い頃から旧ボーダーにいる理由は？","幼少期に近界民絡みの事件に遭遇しかけたためと思われる。","CG","s",[2]],["2023-08-15","d","那須と出水、バイパーの軌道はどちらが上手？","那須は空間認識、出水は勘で引く。バイパー使いとしては那須の方が有名。","TC","s",[2]],["2023-08-15","d","犬飼と黒江の関係は？","犬飼がスコーピオンを練習中、個人ランク戦で黒江に負かされて仲良くなった。","KC","s",[2]],["2023-08-15","d","遠征選抜試験の審査をするA級隊員は泊まり込み？","本部に泊まり込み、8時間交代で審査・防衛任務・休みを回す過酷な仕事。","OK","s",[2]],["2023-08-15","d","2年前に柿崎が隊を抜けたとき嵐山隊は？","佐鳥は残念がり、時枝と綾辻は残念がりつつそれで良いのかもと思った。嵐山は「ライバル」になると考えた。","KC","s",[2]],["2023-08-16","d","来馬が入隊した理由は？","親がボーダーを支援することになり、現場で自分にできることを探したため。","OC","s",[2]],["2023-08-16","d","村上は寝ている間も学習している？","熟睡する時間も普通にあり、問題なしと思われる。","RC","s",[2]],["2023-08-16","d","唯我は防衛任務に参加している？","昔はサボっていたが、今は出水の指導で参加している。","OC","s",[2]],["2023-08-16","d","修は唯我に何勝している？","81勝196敗。","K","s",[2]],["2023-08-16","d","カゲが加古を「ファントムばばあ」と呼んだ理由は？（123話）","A級時代に加古にカモられた苛立ちから。加古はカゲを下に見ているので怒らない。","KC","s",[2]],["2023-08-17","d","時枝の猫2匹の誕生日と好きなものは？","2匹とも保護猫で正確な誕生日は不明。アーサーはクッションなどに猫キック、とみおは祖父とテレビを見るのが好き。","CF","s",[2]],["2023-08-17","d","寺島がエンジニアになる前は誰と組んでいた？","当時はソロで任務や訓練に参加。戦闘員を続けていれば風間隊や諏訪隊に入った可能性も。","OC","s",[2]],["2023-08-17","d","エネドラの角は脳ごと移した？","脳はなく、角に保存された人格・記憶情報をラッドに接続している。思考や会話はレプリカの解析データを流用した実験的な技術。","DRN","s",[2]],["2023-08-17","d","風間と兄・進の年齢差と仲は？","約4歳差で、仲は普通に良かった。","CG","s",[2]],["2023-08-17","d","太刀川が二刀流を始めた時期は？","本人いわく「生まれた時から二刀流」。","C","s",[2]],["2022-12-05","d","スナイパーランキング3位は誰？","資料を確認したところ、東だった。","K","s",[0]],["2022-12-05","d","二宮と加古は、才能のある人を好む点で分かり合える？","二宮は部隊の一員として機能する才能を重視し、加古は個人で輝く才能を求めるので、話は合いにくそう。","C","s",[0]],["2022-12-05","d","なぜ射手は少ない？","二宮・出水・加古の3トップが手本にしにくく、武器でパフォーマンスを調整する方向性も取りにくいから。","TK","s",[0]],["2022-12-05","d","入隊後、最速でA級に上がったのは誰？","条件が時期で変わるので断定できないが、奈良坂・歌川・菊地原あたりが早そう。緑川・ユズル・黒江も早そうで、オペレーターを含めるなら氷見も。","OK","s",[0]],["2022-12-06","d","天羽の黒トリガーは誰から受け継いだもの？ 天羽はネイバー？","旧ボーダーの梅咲鉄弥の遺品。天羽は普通の玄界（三門市）出身。","DC","s",[0]],["2022-12-06","d","烏丸のガイストは一度オンにすると切れない？ レイジのフルアームズは？","ガイストは発動後に解除できない。フルアームズは解除できるが、3つ以上のトリガーを同時に使うのでトリオン消費が大きい。","DT","s",[0]],["2022-12-06","d","眼鏡を外した修はイケメン度が上がる？","多少上がるかもしれないが、ほとんどの人は修だと気づかなくなる。","MZ","s",[0]],["2022-12-06","d","雷神丸は陽太郎を乗せて重くない？ 陽太郎は乗り心地をどう思っている？","雷神丸は見た目によらず力持ちなので平気。陽太郎は乗り心地に満足している。","MZ","s",[0]],["2022-12-07","d","118話の捕捉・掩蔽訓練で、当真が撃った338番は誰？","隠岐か外岡と思われる。外岡は3位だったはずなので、当真に撃たれず逃げ切ったのなら隠岐になりそう。","KC","s",[0]],["2022-12-07","d","鈴鳴第一のスカウト組の出身地は？","今は千葉県、太一は高知 ",[3]],["2023-04-16","d","修にワイヤーを使わせる構想はいつから？","大規模侵攻の頃から。木虎と同じくトリオンが少ない弱点を持つ修に、ワイヤー戦術を考えさせる展開を想定していた。","ST","s",[3]],["2022-12-17","d","遊真の母親について、少しでも情報がほしい。","父・有吾が「死んだらボーダーへ行け」とだけ言い、母を頼れとは言わなかったので、母はすでに亡くなっている可能性が高い。遊真が母譲りなのは、決断が大胆なところ、行動で意思を示すところ、弱音を吐かないところ。","MC","s",[4,5]],["2022-12-17","d","修が生まれて最初に口にした、意味のある言葉は？","話し始めは遅かったが、最初は「おとーさん」「おかーさん」「めがね」などの名詞だったと思う。父の口ぐせをまねて、母を困らせたかもしれない。","CG","s",[4,5]],["2022-12-17","d","千佳の好きなご飯のお供は？","ご飯だけでも進むが、たらこや鮭フレークがあると食べ続けてしまう。","MF","s",[4,5]],["2022-12-17","d","ヒュースがエスクードを選んだ決め手は？（質問文は要確認）","実際に使うところを見たことが決め手になったと思う。頼みたくなかった気持ちもあったのかもしれない（回答の細部は要確認）。","TN","s",[4,5]],["2022-12-17","d","ヒュースが烏丸に生駒旋空を頼んだのは、本気でできると思った？","本気でできると思った面と、頼めば結局やってくれるだろうという面が半々。烏丸は根が甘い。","TN","s",[4,5]],["2022-12-17","d","こちらに残されたちびレプリカは今どこに？","詳しい解析のため、本部の開発室に預けられている。遠征に行くことになれば、遊真が持ち歩きそう。","DM","s",[4,5]],["2022-12-17","d","作者が仲良くなれそうなキャラ、なれなさそうなキャラは？","仲良くなれそうなのは雷蔵、太一、半崎、冬島など（もう1人は表記要確認）。なりにくそうなのは、ガードの堅いクール系の二宮、三輪、真木。クール系でもヒュースとは仲良くなれそう。","SC","s",[4,5]],["2022-12-17","d","学校での遊真の立ち位置は？","最初は話しやすい転校生で、ボーダー入隊後は一目置かれ、話しやすくて優秀なやつとして親しまれている。","MG","s",[4,5]],["2022-12-17","d","閉鎖環境試験の見どころは？","描きたい展開はいろいろあるが、描くことになりそうなのは3つ。二宮とユズルが鳩原をめぐってぎくしゃくするやりとり、自称カナダ人の悩み相談、修と虫っぽい何か。","SO","s",[4,5]],["2024-03-31","d","（森田成一さん）登場キャラが多い中で、次に誰を出すかはどう決める？","出番を待つキャラが多くて悩む。無理に入れず、本編の流れに合わせて描ける場面から出す。三輪にも描きたい場面は多い。","S","s",[8]],["2024-03-31","d","（古川登志夫さん）エネドラの早期退場は最初から決まっていた？","アフトクラトル勢のうち一人が死に、一人が残る展開は前から決めていた。感情で動くエネドラは描いていて楽しく、展開面でも助かった。当初ヒュースに担わせるはずだった情報役を、ヒュースが断ったためエネドラが引き継いだ。","SN","s",[8]],["2024-03-31","d","（柳田淳一さん）アフトクラトルのマントの円の模様の意味は？","円が少ないほど序列が上。純粋な地位というより、直近の任務での功績で決まる。リーダーは円1つ固定、エネドラは円2つ、ランバネインは円3つ。","NZ","s",[8]],["2024-03-31","d","（佐々木望さん）ハイレインの理想の暮らしは？","四大領主として争いが絶えないので、争いを考えなくてよい暮らしを望んでいるのでは。戦いを好むランバネインやヴィザを少し羨ましく思っているかもしれない。","NC","s",[8]],["2025-12-20","d","「20歳組」は「にじゅっさいぐみ」と「はたちぐみ」のどちらが正しい読み？","どっちでもOK。","SZ","s",[10]],["2014-06-05","d","トリオン能力は遺伝する？","遺伝することもあるが確実ではない。千佳の両親はトリオン能力が高くない。","RG","s",[0]],["2014-07-03","d","「先輩」と「さん」の使い分けは？","「先輩」は中学・高校の上級生に、「さん」はそれより年上に使う。修が風間を「先輩」と呼ぶのは本来おかしい。","GZ","s",[0]],["2014-09-17","d","トリガー起動時に「トリガー起動」と言わなくても変身できる？","トリガーホルダーに触れて起動の意志を明確にすれば、無言でも別の言葉でもよい。","T","s",[0]],["2014-04-05","d","入隊に年齢制限はある？","トリオン能力が高ければなし。若い方がトリオン器官が育つため歓迎される。","O","s",[0]],["2024-01-09","d","沢村が本部長補佐になった経緯は？","東と沢村のどちらかを任命する話があり、東が辞退したため沢村に決まった。","O","s",[7]],["2024-01-09","d","片桐が真木を「ナタ振り役」と呼んだ理由は？","冬島の意見が二つに割れる場面を見たのかもしれない。","C","s",[7]],["2024-01-09","d","Tシャツ投票で採用された1DKの間取りで、洗濯機置き場がないのは？","別にランドリースペースがあるのでは、という推測に公式も納得した（本部の単身者用の部屋）。","Z","s",[7]],["2024-01-09","d","片桐隊が防衛任務の帰りに寄る店は？","本部基地1階のコンビニのような売店と思われる。","KF","s",[7]],["2024-01-10","d","修と遊真が「風間先輩」から「風間さん」に変えた時期は？","レイジや小南に指摘されてからと思われる。","MC","s",[7]],["2024-01-10","d","玉狛の食事当番の決め方は？","非番の日に持ち回りで、2週間ごとのシフト。夕方までに冷蔵庫を確認して買い出しをする。","MF","s",[7]],["2024-01-10","d","ヒュースはとりまると同い年と知っている？","知っている。アフトクラトルでは15歳を超えると独り立ちするため、同年代の感覚。千佳は14歳なので年下扱い。","NG","s",[7]],["2024-01-10","d","サイドエフェクトが後から発現することはある？","黒トリガーと共に受け継ぐ遊真の例を除き、後発の記録はない。ただ、本人が気づかず後にSEと判明するケースはよくある。","E","s",[7]],["2024-01-11","d","出穂の空手の段位は？","茶帯（一級）。黒帯（少年段位）はまだ取っていない。","C","s",[7]],["2024-01-11","d","半崎の狙撃手ランキングは？","点取り屋ではなく省エネ型の腕利きなので中位。","KC","s",[7]],["2024-01-11","d","歌川の姉の名前と年齢は？","彩（あや）、24歳。","G","s",[7]],["2024-01-11","d","宇井・王子・イコ・弓場の派閥的な立場は？","宇井は忍田派寄りの自由派、王子は派閥なしの自由派、イコは城戸派寄りの中立、弓場は忍田派寄り。","OC","s",[7]],["2024-01-12","d","遊真は遠征選抜試験の夜に何をしている？","課題の進みが遅いので、修のように夜中に課題を進めているかも。ツイン部屋では寝たふりをして対策を考えている可能性もある。","OC","s",[7]],["2024-01-12","d","菊地原が遠征に一緒に行きたい相手は？","宇佐美栞、東春秋、宇野隼人、半崎義人、三雲修の5人。","OC","s",[7]],["2024-01-12","d","遊真がカゲと遠征したいと書いていたが、カゲも遊真の名前を書いた？","書いていると思われる。","C","s",[7]],["2024-01-12","d","木虎のアンケートに修の名前はある？","木虎は厳しいので、名前はないと思われる。","C","s",[7]],["2024-01-13","d","ゾエが出水と話すのはなぜ？（ランク戦ROUND6）","射手・銃手ポジション同士の横のつながり。ゾエは年齢や性別を問わず誰とでも話す。","KC","s",[7]],["2024-01-13","d","出水が4つセットしている弾トリガーは全部マスタークラス？","全てマスタークラス。アステロイドとバイパーは10000ptを超えている。","TK","s",[7]],["2024-01-13","d","風刃使用時、使用者の体は生身？","トリオン体。風刃に決まった戦闘体のデザインはなく、起動時の服装がそのまま反映される。","DT","s",[7]],["2024-01-13","d","太刀川がA級になったのはいつ？","本人によれば、小学2年生の夏にはすでにA級だった。","KC","s",[7]],["2024-11-11","d","ガロプラメンバーの誕生日は？","ガトリン11/20、コスケロ4/5、ウェン7/11、ラタリコフ9/27、レギー8/24、ヨミ2/14。","NG","s",[9]],["2024-11-11","d","コスケロの一人称は？","「おれ」と思われる。作戦中で上官には「自分」も使うかもしれない。","NC","s",[9]],["2024-11-11","d","ウェンがガトリン隊長にタメ口なのは？","性格もあるが、二人の付き合いが一番長いからだと思われる。","NC","s",[9]],["2024-11-11","d","ガロプラの主食と鹿肉の食習慣は？","過去の戦争で農地が被害を受け、食料は輸入に頼っている。主食は小麦（パン）らしい。鹿肉のほか、牛・豚（イノシシ）・鳥も食べる。","NF","s",[9]],["2024-11-11","d","ラタリコフが好きな「等間隔に並んだもの」は？","整理された本棚の本、大きな建物の窓や柱、箱詰めされた工業製品など。","NC","s",[9]],["2024-11-11","d","遠征艇での遊びは？","ヨミが作ったゲームや、コスケロ私物のトランプ風カードで遊んでいる。","NF","s",[9]],["2024-11-12","d","天羽は隊を組んだことがある？","ない。B級に上がってすぐ、黒トリガーとの対戦でS級になった。防衛任務では通常トリガーを使うこともある。","KC","s",[9]],["2024-11-12","d","忍田はなぜあんなに強い？","スタッフの間では「背後に虎を描いた」という冗談で、ラクダやビーバーなら弱かっただろうとのこと。","CZ","s",[9]],["2024-11-12","d","冬島はボーダー入隊前に仕事をしていた？","年齢的におそらく。システム関係の仕事と思われる。","CG","s",[9]],["2024-11-12","d","米屋は、三輪隊が遊真と戦ったときの「やられても文句言えない」を本気で言った？","半分は本気。17歳でその肝の据わりは立派だと評価された。","KC","s",[9]],["2024-11-12","d","三輪は今もネイバーが嫌い？","嫌い。ただ、当面の目標は最初の侵攻の黒幕の国を見つけて向き合うこと。","NC","s",[9]],["2024-11-12","d","木虎はどうやってトリオン量を増やした？","シミュレーション外、たとえば防衛任務などで積極的にトリオンを使い、トリオン器官を少しずつ鍛えた。筋トレや有酸素運動と同じ。","RC","s",[9]],["2024-11-13","d","歌川はオールラウンダーを目指した？","いいえ。メテオラでチーム戦術のために敵を妨害していたら、自然に条件を満たした。菊地原は近くで爆発すると文句を言う。","TK","s",[9]],["2024-11-13","d","一番忙しい隊員は？","上層部を除くと嵐山、次いで風間。迅は比較的のんびり。","OC","s",[9]],["2024-11-13","d","19歳組は柿崎をどう呼んでいる？","嵐山、イコ、弓場、迅でそれぞれ違う呼び方をする。柿崎は全員を苗字で呼ぶ。","CG","s",[9]],["2024-11-13","d","若村を「麓郎」と呼ぶのは？","16歳組は、名前が特徴的で呼びやすいから名前で呼ぶ。綾辻（要確認）もそう呼ぶ。","CG","s",[9]],["2024-11-13","d","香取隊の出身中学は？","全員バラバラの学校。一部は同じ学校に通い、1人は六穎館（学校名は要確認）。","KG","s",[9]],["2024-11-13","d","香取隊の隊外の友人は？","皆、誰とでも仲良くできるが、チームメイトより親しい人はいない。","KC","s",[9]],["2024-11-14","d","小南が一番好きな果物は？","最近は梨。","MF","s",[9]],["2024-11-14","d","とりまるが抜けてから唯我が入るまでの間、太刀川隊はどう過ごしていた？","「イケメン枠」を誰が埋めるかの議論があり（太刀川を当てる案も出た）、ほどなく唯我が配属された（回答の細部は要確認）。","KC","s",[9]],["2024-11-14","d","ヒュースは学校がある時間、何をしている？","陽太郎に尋問される、ネズミのパトロールに行く、ランク戦の映像で勉強する、お菓子を食べる。","MN","s",[9]],["2024-11-14","d","千佳の雷は光速を超える？","超えない。雷自体がすでに非常に速いので、鉛弾が絡まない限り違いはほとんどわからない。","TM","s",[9]],["2024-11-14","d","修と遊真は千佳をかわいいと思う？","遊真は小動物のようなかわいさと見ている。修も、母がよくかわいいと言うので同じように思っている。","MC","s",[9]],["2024-11-14","d","迅のサングラスに特別な機能はある？","普通のサングラス。ただ、未来視の映像ではサングラスの色味が映らないので、現在の視界と未来の視界を区別しやすい。","EM","s",[9]],["2023-12-18","d","二宮隊に夏服はある？","作者は夏も黒スーツでよいと考えているが、黒ベスト＋袖まくりのシャツ姿が有力。","KC","s",[6]],["2023-12-18","d","ユズルは千佳に告白する？","「遠征部隊に選ばれたら告白する」と言い出したら要注意（フラグ）。","CG","s",[6]],["2023-12-18","d","遊真は虫や木の根を食べたことがある？","父とのサバイバル生活で食料確保に慣れていて、食べ物に困ることはほぼなかったと推測される。","MF","s",[6]],["2023-12-18","d","二宮はなぜお酒を飲まない？","弱いわけではなく、20歳組で飲んだときに何かやらかしたのかも。","CF","s",[6]],["2023-12-18","d","影浦隊に入った経緯は？","大きな秘話はなく、スナイパー訓練で目立ったヒカリに誘われ、堅苦しくなさそうだったのが決め手。","KC","s",[6]],["2023-12-18","d","タイトル「ワールドトリガー」の伏線回収はある？","明確な伏線は描いていないので、期待しすぎずに待ってほしい。","S","s",[6]],["2023-12-18","d","遠征選抜の閉鎖環境試験の服の柄に意味はある？","特に意味はない。トリオンで服を再構築する設定を自然に見せる理由。マネージャーが暗号を仕込んでいる可能性はある。","SO","s",[6]],["2023-12-18","d","ユズルは今の武器以外も使える？","ガンナー用トリガーは使えると思われるが、一発の火力が高い武器が好きなので、近距離でもアイビスを当てにいくスタイル。","TC","s",[6]],["2026-10-05","d","華さんが嵐山さんのファンになったきっかけが知りたいです","入隊試験の時、「近界民の侵攻で両親を亡くした少女」というアオリで突然取材をかけてきた報道関係者から、さりげなく守ってくれたからです","C","v",[12]],["2026-10-05","d","マキリサは、冬島さんと当真のことを何と呼んでいますか？","「隊長」と「当真」です。公の場では「冬島君」「当真君」と呼んでいます","C","v",[12]],["2026-10-05","d","忍田さんも訓練室で訓練をしたり、他の隊員達と手合わせすることはありますか？","最近は忙しいので機会は減りましたが、一応あります。太刀川と模擬戦したりとか。ソロランク戦で一般の隊員と当たる場合もある様子","OK","v",[12]],["2026-10-05","d","出水は太刀川の勉強のできなさ具合をどう思っていますか？","「ボーダーがあってよかったっすね」と思っています。というか本人に言っています","CG","v",[12]],["2026-10-05","d","成績グラフで小南先輩は体育会系側ですが、学校の同級生には本当にオペでないことはバレていないのですか？球技大会などで活躍していそうです","後輩の小早川杏（加古隊オペ）とかも割と運動が得意なので、あんまりバレてないと思います","CG","v",[12]],["2026-10-06","d","29巻の袖イラストのエネドラッドは、どうやって稼働していますか？","雷蔵からトリオンをもらって動いていると思われます。ワイヤレス充電的な。","RZ","v",[12]],["2026-10-06","d","穂刈は家事全般、手馴れてるように見えましたが、普段からお料理などをしているのでしょうか？","してそうな気がします。荒船隊の中で、荒船と穂刈は割と何でも自分でやってみるタイプで、加賀美と半崎は専門分野に興味が偏ってるタイプだと思います","FC","v",[12]],["2026-10-06","d","佐伯が万能手なのは、自身が目指したからですか？それとも草壁隊長の方針ですか？","元々は攻撃手で佐伯隊の隊長兼エースでしたが、草壁隊になってから隊長命令で万能手にコンバートされました","KC","v",[12]],["2026-10-06","d","佐鳥君のことを明るいムードメーカーだと思っていましたが、13巻P185の表情を見て印象が変わりました。先生は彼のことをどのような人物だと捉えていますか？","ボーダーの中でも、かなりかっこいいやつだと思っています","C","v",[12]],["2026-10-06","d","鉛弾を開発した人は誰ですか？また、そのきっかけは何でしょうか？","遠征部隊が持ち帰った「敵の破壊ではなく、無力化を目的としたトリガー」をベースにして、チーフエンジニアの望月が作りました。クセが強いトリガーはだいたい望月の作です","DT","v",[12]],["2026-10-07","d","奈良坂くんのお姉さんの名前と年齢を知りたいです。那須さんとは仲が良いのでしょうか？","忍（しのぶ・20歳）です。那須さんにとっても姉みたいなポジションだと思われます。進学校卒業組なので、加古さんとかとも横のつながりがあるのかも","CG","v",[12]],["2026-10-07","d","羽矢さんは蔵内くんに隊服のリテイクを何回くらいましたか？ またその時の心情を教えてください","２回くらいだと思います。羽矢さんは「これが読者（顧客）に合わせるってことか……！」と思ったようです","KC","v",[12]],["2026-10-07","d","志岐さんと辻くんが出会ったらどうなりますか？","くまとひゃみが、どこからともなく現れて、通訳をはじめると思います","C","v",[12]],["2026-10-07","d","菊地原と隊のみならず、学校のクラスまで同じなことを歌川くんはどう思っていますか？","「菊地原が誰かと揉めそうなとき、フォローしに行きやすいから助かる」と思っています","CG","v",[12]],["2026-10-07","d","トリオン体をいじれば黒髪にできると思うんですが、遊真が白髪のままなのは何故ですか？","遊真の日常モードのトリオン体は、黒トリガーで固定されているので白髪のままです。トリガー起動時の戦闘体は、エンジニアに頼めば黒髪にできそうですね","RM","v",[12]],["2026-10-08","d","出水くんや歌川くんなど、ボーダーの「姉がいる隊員」は、家ではお姉さんとどんな力関係で暮らしていますか？\n（※回答は次のポストで）","姉との力関係は、\n■割と対等でお互いを尊重……歌川、当真、奈良坂、桜子\n■こき使われてるけど愛はある感じ……出水、犬飼(長姉)、半崎\n■甘やかされ気味……三輪、虎太郎、小佐野\n■頼られ気味……犬飼（次姉）、若村\nたぶんこんな感じだと思います","CG","v",[12]],["2026-10-08","d","マリオちゃんは兄たちと仲は良いですか？","仲は悪くないと思います。割と甘やかされがちで、それがマリオ的には若干おもしろくない、みたいな感じです","CG","v",[12]],["2026-10-08","d","なぜ今ちゃんは弓場さんのようにいつも立ったままミーティングしているのですか？","甘味で得たカロリーを少しでも消費するためかもしれません","CF","v",[12]],["2026-10-08","d","犬飼先輩はシールドをぐねぐね変形させていますが、これは高等技術なのですか？","時間をかければ誰でもできますが、咄嗟に素早くやるのは難しいタイプの技術だと思います。地道な習練のたまものです","T","v",[12]],["2026-10-08","d","影浦くんが近くにいることを認識していない状態で、彼のことを考えていた場合でも影浦くんのＳＥは反応しますか？","おそらく、発信者の視界内にカゲがいないと、カゲのＳＥは反応しないと思います","E","v",[12]]];

/* ===== 公式Q&Aまとめ ===== */
const QAT=Object.fromEntries(QATAGS);
const qesc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qaDate=r=>{const[y,m,d]=r[0].split("-");return r[1]==="m"?`${y}年${+m}月`:`${y}年${+m}月${+d}日`};
let QS={q:"",dir:"desc",tags:new Set(),panel:false};
function qaList(){
  app.innerHTML=`${topbar("","公式Q&Aまとめ")}
  <input id="qq" type="search" placeholder="Q&Aに含まれる言葉で検索（スペースで複数指定）" value="${qesc(QS.q)}" aria-label="Q&Aを検索">
  <div class="pnbox"><button class="btn tgbtn" id="tg" type="button"></button>
  <div id="pn">
  <div class="fl">公開日の並び順</div>
  <div class="sortbar"><div class="seg" id="sd"><button data-v="desc">新しい順</button><button data-v="asc">古い順</button></div></div>
  <div class="fl">ジャンル（タグ）で絞り込み（複数選択可：いずれかに当てはまるものを表示）</div>
  <div class="chips" id="fc"><button class="chip" data-v="">すべて</button>${QATAGS.map(([k,v])=>`<button class="chip" data-v="${k}">${v}</button>`).join("")}</div>
  </div></div>
  <div class="cnt" id="cnt"></div><div id="ls"></div>
  <p class="note">質問をタップすると、質問・回答・出典リンク・タグを見られます。公開日は公式Xの投稿日です。月までしか確認できなかったものは「年月」のみ表示し、並び順では月初として扱います。各項目の「原文ママ」「要約」の表示は、掲載している文章が公式の文面そのままか、私が言い換えたものかを示します。2026年10月の企画は、公式Xからコピーされた文面を掲載しています（各日の1件目の導入・最終投稿は含みません）。</</p>`;
  const inp=document.getElementById("qq"),sd=document.getElementById("sd"),fc=document.getElementById("fc"),tg=document.getElementById("tg"),pn=document.getElementById("pn");
  inp.oninput=()=>{QS.q=inp.value;draw()};
  Array.from(sd.querySelectorAll("button")).forEach(b=>{b.onclick=()=>{QS.dir=b.dataset.v;draw()}});
  Array.from(fc.querySelectorAll("button")).forEach(b=>{b.onclick=()=>{togSet(QS.tags,b.dataset.v);draw()}});
  tg.onclick=()=>{QS.panel=!QS.panel;draw()};
  draw();
  function draw(){
    const ws=QS.q.split(/\s+/).map(norm).filter(Boolean);
    pn.hidden=!QS.panel;
    const nAct=(QS.dir!=="desc"?1:0)+QS.tags.size;
    tg.textContent=`並び替え・タグで絞り込み ${QS.panel?"▲":"▼"}${nAct?`（${nAct}件適用中）`:""}`;
    Array.from(sd.querySelectorAll("button")).forEach(b=>b.classList.toggle("on",b.dataset.v===QS.dir));
    Array.from(fc.querySelectorAll("button")).forEach(b=>b.classList.toggle("on",b.dataset.v===""?QS.tags.size===0:QS.tags.has(b.dataset.v)));
    let r=QA.map((x,i)=>({x,i})).filter(({x})=>{
      if(QS.tags.size&&!Array.from(x[4]).some(c=>QS.tags.has(c)))return false;
      if(!ws.length)return true;
      const h=norm(x[2]+x[3]);
      return ws.every(w=>h.includes(w));
    });
    r.sort((a,b)=>(a.x[0]<b.x[0]?-1:a.x[0]>b.x[0]?1:0)*(QS.dir==="desc"?-1:1)||a.i-b.i);
    document.getElementById("cnt").textContent=r.length+"件";
    document.getElementById("ls").innerHTML=r.length?r.map(({x,i})=>`<button class="qa qi" data-a="qaopen" data-i="${i}"><div class="qd"><span>${qaDate(x)}</span><span class="kind${x[5]==="v"?" v":""}">${x[5]==="v"?"原文ママ":"要約"}</span></div><div class="qq1">Q. ${qesc(x[2].replace(/\s*\n\s*/g," "))}</div></button>`).join(""):'<p class="sub">該当するQ&Aがありません。別の言葉やタグで試してください。</p>';
  }
  if(QS.y){scrollTo(0,QS.y);QS.y=0}else scrollTo(0,0);
}

function qaDetail(i){
  const x=QA[i];
  if(!x){location.hash="#qa";return}
  const v=x[5]==="v";
  app.innerHTML=`${topbar("","Q&A詳細")}<button class="back" data-a="qaback">‹ 一覧へ戻る</button><div class="qa"><div class="qd">${qaDate(x)}</div><div class="qq qtxt">Q. ${qesc(x[2])}</div><div class="qaa qtxt">A. ${qesc(x[3])}</div><div class="qtags">${Array.from(x[4]).map(c=>`<span class="qtag">${QAT[c]}</span>`).join("")}</div></div><div class="fl">参考リンク</div><ul class="qsrc">${x[6].map(k=>`<li><a href="${QASRC[k][1]}" target="_blank" rel="noopener noreferrer">${qesc(QASRC[k][0])}</a></li>`).join("")}</ul><p class="note">${v?"【原文ママ】公式Xの投稿文をコピーしたものです（スレッド内の順番を示す「(2/7)」などの表記と、行末の空白は除いています）。":"【要約】公式の文面そのままではなく、私が要点を言い換えたものです。正確な文言は参考リンク先でご確認ください。個別の投稿URLは確認できていないため、リンクは掲載ページ単位です。"}</p>`;
  scrollTo(0,0);
}

/* ===== マルチプレイ（Cloudflare Workers + Durable Objects／WebSocket・サインイン不要・ホストなし） ===== */
const MP_SERVER="";/* ← ここにサーバー（Worker）のURLを書きます。例："https://wt-mp.あなたのアカウント.workers.dev" */
const MPPER={easy:1,normal:2,hard:3},MPLV={easy:"簡単",normal:"普通",hard:"難しい"},MPTY={chart:"チャートクイズ",trig:"トリガーセットクイズ"};
let MP=null,MPSEQ=0,MPCFG={type:"chart",level:"normal",mode:"timer",limit:30,minor:false,near:false,nick:"",code:""};
const MPT={tick:500,wait:8000,fto:8000};
const mpBase=()=>String((typeof window!=="undefined"&&window.WT_MP_URL)||MP_SERVER||"").replace(/\/+$/,"");
async function mpApi(path){
  const base=mpBase();if(!base)throw new Error("nourl");
  const ac=typeof AbortController!=="undefined"?new AbortController():null;
  const to=ac?setTimeout(()=>ac.abort(),MPT.fto):null;
  try{
    const r=await fetch(base+path,{signal:ac?ac.signal:undefined});
    if(!r.ok)throw new Error("http"+r.status);
    return await r.json();
  }finally{if(to)clearTimeout(to)}
}
let MPUID="";
function mpUid(){
  if(MPUID)return MPUID;
  let u="";try{u=sessionStorage.getItem("wtuid")||""}catch(e){}
  if(!/^[a-z0-9]{10,24}$/.test(u)){u="";const c="abcdefghijklmnopqrstuvwxyz0123456789";for(let i=0;i<14;i++)u+=c[Math.floor(Math.random()*c.length)];try{sessionStorage.setItem("wtuid",u)}catch(e){}}
  return MPUID=u;
}

function mpMsg(t){const e=document.getElementById("mpmsg");if(e)e.textContent=t||""}
function mpBuild(cfg){
  const pool=DATA.filter(c=>c.pos!=="OP"&&(cfg.minor||!MINOR_SET.includes(c.name))&&(cfg.near||!NEAR_SET.includes(c.name))&&(cfg.type==="chart"?c.st.every(v=>v!=null):!!VER[c.name]));
  const groups={};
  if(cfg.type==="trig")pool.forEach(c=>{(groups[setKey(c)]=groups[setKey(c)]||[]).push(c.name)});
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  let pick=pool;
  if(cfg.type==="trig"){const seen=new Set();pick=[];for(const c of pool){const k=setKey(c);if(seen.has(k))continue;seen.add(k);pick.push(c);if(pick.length===10)break}}
  return pick.slice(0,10).map(c=>({c:c.name,g:cfg.type==="trig"?groups[setKey(c)]:[c.name]}));
}
function mpNick(){const n=(mpVal("mpnick")||MPCFG.nick||"").trim().slice(0,12);if(n){try{localStorage.setItem("wtnick",n)}catch(e){}}return n||("プレイヤー"+(1+Math.floor(Math.random()*99)))}
function mpErr(e){
  const m=e&&e.message;
  if(m==="nourl")return "サーバーが設定されていません。";
  if(m==="full")return "そのルームは満員です（最大8人）。";
  if(m==="finished")return "そのルームはすでに終了しています。";
  if(m==="exists"||m==="invalid")return "ルームを作れませんでした。もう一度お試しください。";
  return "サーバーに接続できませんでした。時間をおいてもう一度お試しください。";
}
function mpMeta(cfg){
  const items=mpBuild(cfg);
  if(items.length<10)throw new Error("noitems");
  return{type:cfg.type,level:cfg.level,mode:cfg.mode,limit:+cfg.limit||30,items};
}
async function mpCreate(){
  mpSaveInputs();
  try{
    const meta=mpMeta(MPCFG),{code}=await mpApi("/api/new");
    await mpEnter(code,mpNick(),meta);
  }catch(e){mpMsg(e&&e.message==="noitems"?"出題できるキャラが足りません。出題範囲を変えてください。":mpErr(e))}
}
async function mpQuick(){
  mpSaveInputs();
  try{
    const nick=mpNick(),q=await mpApi("/api/quick");
    const meta=q.create?mpMeta({type:"chart",level:"normal",mode:"timer",limit:30,minor:false,near:false}):null;
    await mpEnter(q.code,nick,meta);
  }catch(e){mpMsg(mpErr(e))}
}
async function mpJoin(code){
  mpSaveInputs();
  code=String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)){mpMsg("ルームコードは4文字で入力してください。");return}
  try{
    const r=await mpApi("/api/room?code="+code);
    if(!r.exists){mpMsg("そのルームは見つかりません。");return}
    await mpEnter(code,mpNick(),null);
  }catch(e){mpMsg(mpErr(e))}
}
function mpEnter(code,nick,init){
  return new Promise((resolve,reject)=>{
    const uid=mpUid();
    if(MP)mpLeave();
    const m={code,uid,id:++MPSEQ,off:0,room:null,players:[],me:{nick,ans:{},total:0,go:false},nick,key:"",sig:"",closed:false,ended:false,fail:0,ws:null,leaving:false,sent:{},timers:[],init,first:true};
    let done=false;
    const fin=(err)=>{if(done)return;done=true;clearTimeout(wt);if(err){m.leaving=true;try{m.ws&&m.ws.close()}catch(e){}reject(err)}else resolve()};
    const wt=setTimeout(()=>fin(new Error("timeout")),MPT.wait);
    const connect=()=>{
      if(m.leaving)return;
      let ws;
      try{ws=new WebSocket(mpBase().replace(/^http/,"ws")+"/ws?room="+code+"&uid="+uid)}catch(e){fin(e);return}
      m.ws=ws;
      ws.onopen=()=>{
        ws.send(JSON.stringify({t:"hello",nick:m.nick}));
        if(m.init&&m.first){ws.send(JSON.stringify({t:"init",meta:m.init}))}
        m.first=false;m.fail=0;
      };
      ws.onmessage=ev=>{
        let d;try{d=JSON.parse(ev.data)}catch(e){return}
        if(d.t==="full"||(d.t==="error"&&(d.code==="finished"||d.code==="exists"||d.code==="invalid"))){m.leaving=true;fin(new Error(d.t==="full"?"full":d.code));return}
        if(d.t==="closed"){if(m.room&&m.room.st.phase==="done")m.ended=true;else{m.room=null;m.closed=true}m.leaving=true;mpView();return}
        if(d.t==="wait"){if(!done){MP=m;fin()}return}
        if(d.t==="state"){
          m.off=d.now-Date.now();
          m.room={meta:d.meta,st:d.st};
          m.players=d.players.slice().sort((a,b)=>(a.at||0)-(b.at||0)||(a.id<b.id?-1:1));
          const me=m.players.find(p=>p.id===uid);
          if(me)m.me=Object.assign({},m.me,me);
          if(!done){MP=m;try{sessionStorage.setItem("wtmp",code)}catch(e){}fin()}
          if(MP===m)mpView();
        }
      };
      ws.onclose=()=>{
        if(m.leaving||MP!==m&&done)return;
        m.fail++;
        if(!done&&m.fail>=3){fin(new Error("conn"));return}
        setTimeout(connect,Math.min(1000*m.fail,5000));
        if(MP===m)mpView();
      };
      ws.onerror=()=>{};
    };
    m.timers.push(setInterval(()=>mpTick(m),MPT.tick));
    connect();
  }).then(()=>{if(location.hash==="#mpr")mpView();else location.hash="#mpr"});
}
function mpSend(m,o){try{if(m.ws&&m.ws.readyState===1)m.ws.send(JSON.stringify(o))}catch(e){}}
function mpTick(m){
  if(MP!==m||!m.room)return;
  const st=m.room.st,meta=m.room.meta,now=mpNow();
  const el=document.getElementById("mpclock");
  if(el){
    let t="";
    if(st.phase==="lobby"){const on=m.players.filter(p=>p.online),rd=on.filter(p=>p.go).length;t=on.length<2?"2人以上そろうまでお待ちください":`準備完了 ${rd} / ${on.length}人　全員が準備完了になると始まります`}
    else if(st.phase==="q")t=meta.mode==="timer"?`残り ${Math.max(0,Math.ceil((st.dl-now)/1000))} 秒`:"全員が答えると次へ進みます";
    else if(st.phase==="a")t=`次の問題まで ${Math.max(0,Math.ceil((st.t0+MPT.revealMs-now)/1000))} 秒`;
    el.textContent=t;
  }
  if(st.phase==="q"&&!mpAnswered(m,st.i)&&now>=st.dl)mpSubmit(true);
}
MPT.revealMs=8000;
function mpAnswered(m,i){return !!m.sent[i]||(m.me.ans&&m.me.ans[i]!==undefined)}
function mpLeave(){
  const m=MP;if(!m)return;
  MP=null;m.leaving=true;
  m.timers.forEach(t=>clearInterval(t));
  try{sessionStorage.removeItem("wtmp")}catch(e){}
  try{mpSend(m,{t:"leave"});setTimeout(()=>{try{m.ws.close()}catch(e){}},200)}catch(e){}
}
function mpMaxPts(r){return r.meta.items.reduce((s,x)=>s+(x?x.g.length:0),0)*r.meta.per}
function mpRank(list){
  const s=list.slice().sort((a,b)=>(b.total||0)-(a.total||0)||(a.at||0)-(b.at||0));
  let r=0,prev=null;
  return s.map((p,i)=>{const t=p.total||0;if(t!==prev){r=i+1;prev=t}return Object.assign({},p,{rank:r})});
}
function mpSubmit(auto){
  const m=MP;if(!m||!m.room||m.room.st.phase!=="q")return;
  const i=m.room.st.i,it=m.room.meta.items[i];
  if(!it||mpAnswered(m,i))return;
  const inputs=[];
  for(let k=0;k<it.g.length;k++)inputs.push(mpVal("mpa"+k));
  m.sent[i]=true;m.key="";m.sig="";
  mpSend(m,{t:"ans",i,inputs});
  mpView();
}
function mpGo(){const m=MP;if(!m)return;m.me.go=!m.me.go;m.sig="";mpSend(m,{t:"ready",v:m.me.go});mpView()}
function mpHead(m){return `${topbar("","マルチプレイ")}`}
function mpPlayersHTML(m){
  return `<div class="cnt">参加者 ${m.players.length}人</div>`+m.players.map(p=>`<div class="item" style="cursor:default"><span class="nm">${qesc(p.nick||"?")}${p.id===m.uid?'<span class="tm">（あなた）</span>':""}${p.online?"":'<span class="tm">（切断中）</span>'}</span>${m.room&&m.room.st.phase==="lobby"&&p.online?`<span class="tm">${p.go?"✔ 準備完了":"準備中"}</span>`:""}</div>`).join("");
}
function mpView(){
  if(location.hash!=="#mpr")return;
  const m=MP;
  if(!m){location.hash="#mp";return}
  const r=m.room;
  if(!r){
    const k="none|"+m.closed+"|"+m.fail;
    if(m.sig===k)return;m.sig=k;m.key="";
    app.innerHTML=`${mpHead(m)}<p class="sub" style="margin-top:16px">${m.closed?"ルームが閉じられました。":m.fail>=3?"サーバーに接続できません。再接続を試みています…":"ルームを読み込んでいます…"}</p>${m.closed?'<div class="qb"><button class="btn pri big" data-h="#mp">マルチプレイのメニューへ</button></div>':""}`;
    return;
  }
  const st=r.st,meta=r.meta,i=st.i,it=meta.items[i];
  const endNote=m.ended?'<p class="note">ルームは閉じられました。この画面の結果はそのまま見られます。</p>':"";
  const net=m.fail>=3?'<p class="note" style="color:#c0392b">サーバーに接続できません。再接続を試みています…</p>':"";
  const cfgLine=`${MPTY[meta.type]}　／　${MPLV[meta.level]}（1問${meta.per}点）　／　${meta.mode==="timer"?`1問${meta.limit||30}秒`:"全員が答えたら次へ"}　／　全${meta.n}問　／　2〜8人`;
  const psig=m.players.map(p=>[p.id,p.nick,p.total||0,p.ans?Object.keys(p.ans).length:0,p.online?1:0].join(":")).join(",");
  if(st.phase==="lobby"){
    const sig="l|"+m.players.map(p=>p.id+(p.go?1:0)).join(",")+"|"+psig+"|"+m.fail+"|"+(m.me.go?1:0);
    if(m.sig===sig)return;m.sig=sig;m.key="";
    app.innerHTML=`${mpHead(m)}${net}<div class="fl" style="text-align:center">ルームコード（友だちに伝えてください）</div><div class="mpcode">${qesc(m.code)}</div>
    <p class="sub" style="text-align:center">${cfgLine}</p>
    ${mpPlayersHTML(m)}
    <p class="sub" id="mpclock" style="text-align:center;margin-top:12px"></p>
    <div class="qb"><button class="btn${m.me.go?"":" pri"} big" data-a="mpgo"${m.players.filter(p=>p.online).length<2?" disabled":""}>${m.players.filter(p=>p.online).length<2?"2人以上で準備完了にできます":m.me.go?"準備を取り消す":"準備完了"}</button></div>
    <div class="qb2"><button class="btn big" data-a="mpexit">ルームを出る</button></div>`;
    mpTick(m);return;
  }
  if(st.phase==="done"){
    const sig="d|"+psig+"|"+m.ended;
    if(m.sig===sig)return;m.sig=sig;m.key="";
    const rk=mpRank(m.players),max=mpMaxPts(r);
    app.innerHTML=`${mpHead(m)}<h2 class="qt">最終結果</h2>${endNote}
    <table class="rt">${rk.map(p=>`<tr><td>${p.rank}</td><td>${qesc(p.nick||"?")}${p.id===m.uid?'<span class="sub">（あなた）</span>':""}</td><td>${p.total||0}<span class="sub"> / ${max}</span></td></tr>`).join("")}</table>
    <div class="qb2" style="margin-top:18px"><button class="btn pri big" data-a="mpexit">ルームを出る</button></div>`;
    return;
  }
  const c=DATA.find(x=>x.name===it.c),isC=meta.type==="chart";
  const body=isC?`<div class="chart">${radar(c.st,KEYS,c.total,false,new Set())}</div>`:qtrig(c);
  const bar=`${mpHead(m)}${net}<div class="qn" style="margin:4px 0">第${i+1}問 / ${meta.n}　<span class="sub">ルーム ${qesc(m.code)}</span></div>`;
  const answered=mpAnswered(m,i);
  const alive=m.players.filter(p=>p.online);
  const nAns=alive.filter(p=>p.ans&&p.ans[i]!==undefined).length;
  const stat=`回答済み ${nAns} / ${alive.length}人`;
  if(st.phase==="q"&&!answered){
    const key="q|"+i;
    if(m.key===key){const e=document.getElementById("mpst");if(e)e.textContent=stat;return}
    m.key=key;m.sig="";
    const n=it.g.length;
    let boxes="";
    for(let k=0;k<n;k++)boxes+=`<div class="ansbox">${n>1?`<label class="ansl" for="mpa${k}">回答${k+1}</label>`:""}<input id="mpa${k}" type="text" placeholder="キャラクター名を入力（例：${({easy:"みくも おさむ",normal:"三雲 おさむ",hard:"三雲 修"})[meta.level]}）" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
    const same=n>1?`<p class="same">同じトリガーセットのキャラクターが${n}人います。${n}人分の名前を入力してください（順不同）</p>`:"";
    app.innerHTML=`${bar}<p class="res" id="mpclock" style="margin:6px 0;padding:8px;font-weight:700"></p><h2 class="qt">${isC?"このチャートのキャラクターは？":"このトリガーセットのキャラクターは？"}</h2>${same}${body}${boxes}<div class="qb"><button class="btn pri big" data-a="mpans">回答する</button></div><p class="sub" id="mpst" style="text-align:center">${stat}</p>${isC?SRC:""}`;
    mpTick(m);return;
  }
  m.key="";
  const sig=st.phase+"|"+i+"|"+psig+"|"+m.fail;
  if(m.sig===sig)return;m.sig=sig;
  if(st.phase==="q"){
    app.innerHTML=`${bar}<div class="res"><div>回答を送信しました</div><div class="sub" id="mpst">${stat}</div><div class="sub" id="mpclock"></div></div>`;
    mpTick(m);return;
  }
  /* phase a: 答え合わせ（自動で次へ進みます） */
  const rk=mpRank(m.players),last=i===meta.n-1,max=mpMaxPts(r);
  const nl=nm=>`<button class="nlk" data-a="pop" data-n="${qesc(nm)}">${nameRuby(nm)}</button>`;
  const rows=rk.map(p=>{
    const a=p.ans&&p.ans[i],ins=a?a.in.filter(x=>x&&x.trim()).map(qesc).join("／"):"";
    return `<tr><td>${p.rank}</td><td>${qesc(p.nick||"?")}${p.id===m.uid?'<span class="sub">（あなた）</span>':""}<div class="sub">${a?(ins||"（未入力）"):"（未回答）"}</div></td><td>${a?"+"+(a.pt||0):"—"}</td><td>${p.total||0}</td></tr>`;
  }).join("");
  app.innerHTML=`${bar}<div class="ans"><div class="sub">答え</div><h2 class="aname${it.g.length>1?" multi":""}">${it.g.map(nl).join("、")}</h2><div class="same" style="margin-top:0">名前をタップすると詳細を見られます</div></div>${body}
  <h3>みんなの結果（合計 / ${max}点満点）</h3><table class="rt mpt"><tr><td></td><td class="sub">名前・回答</td><td class="sub">今回</td><td class="sub">合計</td></tr>${rows}</table>
  <p class="res" id="mpclock" style="margin-top:14px;font-weight:700"></p><p class="sub" style="text-align:center">${last?"このあと最終結果が表示されます":"自動で次の問題へ進みます"}</p>${isC?SRC:""}`;
  mpTick(m);
}

app.onclick=e=>{
  const el=e.target.closest("[data-h],[data-a]");
  if(!el)return;
  if(el.dataset.h!==undefined){location.hash=el.dataset.h;return}
  const a=el.dataset.a,s=el.dataset.s;
  if(a==="back"){
    if(stack.length){const t=stack.pop();if(t!==cur){backing=true;location.hash=t}}
    else location.hash="#list";
    return}
  if(a==="qaopen"){QS.y=scrollY;location.hash="#qa/"+el.dataset.i;return}
  if(a==="qaback"){if(stack.length&&stack[stack.length-1]==="#qa"){stack.pop();backing=true}location.hash="#qa";return}
  if(a==="mpcfg"){mpSaveInputs();const k=el.dataset.k,v=el.dataset.v;if(k==="minor"||k==="near")MPCFG[k]=!MPCFG[k];else if(k==="limit")MPCFG.limit=+v;else MPCFG[k]=v;mpMenuDraw();return}
  if(a==="mpquick"){mpQuick();return}
  if(a==="mpcreate"){mpCreate();return}
  if(a==="mpjoin"){mpJoin(mpVal("mpcode"));return}
  if(a==="mplast"){mpJoin(el.dataset.c);return}
  if(a==="mpgo"){mpGo();return}
  if(a==="mpans"){mpSubmit();return}
  if(a==="mpexit"){location.hash="#qm";return}
  if(a==="opt"){openOpt();return}
  if(a==="endq"){openModal("本当に終了しますか？");return}
  if(a==="gohome"){
    if(cur==="#list"||cur==="#quiz"||cur==="#qm"||cur==="#mp"||cur==="#qa"||cur.indexOf("#qa/")===0){QZ=null;location.hash="";return}
    openModal(cur==="#qp"?"本当に終了しますか？":cur==="#mpr"?"ルームから退出してホームに戻りますか？":"ホームに戻りますか？");
    return}
  if(a==="minor"){MINOR=el.checked;return}
  if(a==="near"){NEAR=el.checked;return}
  if(a==="typed"){TYPED=el.checked;return}
  if(a==="pop"){openPop(el.dataset.n);return}
  if(a==="qstart"){startQuiz(s);return}
  if(a==="qans"&&QZ){submitAnswer();return}
  if(a==="qhome"){QZ=null;location.hash="";return}
  if(a==="qagain"&&QZ){startQuiz(QZ.type);return}
  if(a==="qchange"&&QZ){QZ=null;location.hash="#quiz";return}
  if(a==="qnext"&&QZ){if(QZ.i<QZ.items.length-1){QZ.i++;QZ.phase="q";quizPlay()}else if(QZ.typed){QZ.phase="r";quizPlay()}else{QZ=null;location.hash=""}return}
  const c=DATA[HS.id],st=HS[s];
  if(!c||!st)return;
  if(a==="start"){st.m="select";st.sel=new Set()}
  else if(a==="hideall"){st.act=new Set(allKeys(s,c));st.m="hidden"}
  else if(a==="tog"){const i=el.dataset.i;st.sel.has(i)?st.sel.delete(i):st.sel.add(i)}
  else if(a==="all")st.sel=new Set(allKeys(s,c));
  else if(a==="none")st.sel=new Set();
  else if(a==="ok"){st.act=new Set(st.sel);st.m=st.act.size?"hidden":"show"}
  else if(a==="cancel")st.m=st.act.size?"hidden":"show";
  else if(a==="reset"){st.act=new Set();st.sel=new Set();st.m="show"}
  else if(a==="change"){st.sel=new Set(st.act);st.m="select"}
  detail(HS.id,true);
};

app.onkeydown=e=>{
  if(e.key==="Enter"&&!e.isComposing&&e.target&&/^mpa\d+$/.test(e.target.id||"")){
    e.preventDefault();
    const nx=document.getElementById("mpa"+(parseInt(e.target.id.slice(3),10)+1));
    if(nx&&nx.focus)nx.focus();else mpSubmit();
    return;
  }
  if(e.key!=="Enter"||e.isComposing||!e.target||!/^ans\d+$/.test(e.target.id||""))return;
  e.preventDefault();
  const nx=document.getElementById("ans"+(parseInt(e.target.id.slice(3),10)+1));
  if(nx&&nx.focus)nx.focus();else submitAnswer();
};

function route(){
  /* クイズ中はブラウザの戻る・進むを無効化：#qp 以外へ移動したら #qp に戻す */
  if(QZ){
    if(location.hash!=="#qp"){location.hash="#qp";return}
    if(location.hash===cur)return;
  }
  pop.hidden=true;opt.hidden=true;
  if(MP&&location.hash!=="#mpr")mpLeave();
  if(location.hash!==cur){
    if(location.hash==="")stack=[];
    else if(!backing)stack.push(cur);
    backing=false;cur=location.hash;
  }
  const h=decodeURIComponent(location.hash);
  let m;
  if(m=h.match(/^#c(\d+)$/))detail(+m[1]);
  else if(m=h.match(/^#([ptgb])\/(.+)$/))filtered(m[1],m[2]);
  else if(h==="#list")list();
  else if(m=h.match(/^#qa\/(\d+)$/))qaDetail(+m[1]);
  else if(h==="#qa")qaList();
  else if(h==="#qm")qmSelect();
  else if(h==="#mp")mpMenu();
  else if(h==="#mpr")mpView();
  else if(h==="#quiz")quizSelect();
  else if(h==="#qp")quizPlay();
  else home();
}
addEventListener("hashchange",route);
route();
</script>
